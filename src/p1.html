<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#05070b">
<title>XTechnology Group HQ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700;800&family=Cairo:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=Michroma&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: dark command rail (fixed in both themes, it carries the chrome logo) + sticky glass top bar + work surface of cards.
   Themes: dark (default, brand) and light. The page's own switch sets data-xt; without it the viewer's theme decides. */
:root{
  --bg:#05070b; --panel:#0c1018; --panel2:#121824; --panel3:#18202d; --line:#1a2230; --line2:#263142;
  --fg:#e9edf5; --muted:#8a95a8; --dim:#5c6779; --input:#080b11; --hover:rgba(109,151,255,.06);
  --accent:#2f6bff; --accent-hi:#6d97ff; --accent-soft:rgba(47,107,255,.14); --accent-line:rgba(47,107,255,.45); --on-accent:#fff;
  --silver:#c9d1de;
  --ok:#2fbf71; --ok-soft:rgba(47,191,113,.14); --warn:#e8a93a; --warn-soft:rgba(232,169,58,.14); --bad:#ef5350; --bad-soft:rgba(239,83,80,.14);
  --c-1:#2f6bff; --c-2:#a87bff; --c-exp:#3a4558; --c-target:#263142; --c-axis:#5c6779; --c-grid:#161d29;
  --topbar:rgba(5,7,11,.78); --out-day:#080b11; --over:#0e1626; --card:#121824; --card-line:#222b3a;
  --shadow:0 1px 0 rgba(255,255,255,.035) inset,0 10px 30px rgba(0,0,0,.28); --shadow-lg:0 30px 80px rgba(0,0,0,.6);
  --hi:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0) 40%);
  --kpi-lead:linear-gradient(135deg,rgba(47,107,255,.22),rgba(47,107,255,.04) 60%);
  --av-l:24%; --av-t:82%; --page-glow:rgba(47,107,255,.07);
  --rail:#070a10; --rail-2:#0d121b; --rail-line:#151c27; --rail-fg:#e9edf5; --rail-muted:#8a95a8; --rail-dim:#566174; --rail-on:rgba(47,107,255,.16);
  --tip-bg:#0b0f17; --tip-fg:#e9edf5; --tip-line:#263142;
  --f-brand:"Michroma","Eurostile","Arial Black",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:12px; color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-xt]):not([data-theme="dark"]){
  --bg:#f3f5f9; --panel:#ffffff; --panel2:#f6f8fb; --panel3:#eef2f7; --line:#e4e9f1; --line2:#d3dbe7;
  --fg:#0c1322; --muted:#566175; --dim:#8a94a6; --input:#ffffff; --hover:rgba(36,87,245,.045);
  --accent:#2457f5; --accent-hi:#1d4ad6; --accent-soft:rgba(36,87,245,.09); --accent-line:rgba(36,87,245,.4);
  --silver:#3b4558;
  --ok:#12945a; --ok-soft:rgba(18,148,90,.1); --warn:#b26a00; --warn-soft:rgba(214,140,20,.13); --bad:#d6342f; --bad-soft:rgba(214,52,47,.09);
  --c-1:#2457f5; --c-2:#8b5cf6; --c-exp:#c4ccd9; --c-target:#dde3ec; --c-axis:#8a94a6; --c-grid:#edf0f5;
  --topbar:rgba(243,245,249,.82); --out-day:#f8fafc; --over:#eef3ff; --card:#ffffff; --card-line:#e1e7f0;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 6px 18px rgba(16,24,40,.05); --shadow-lg:0 30px 80px rgba(16,24,40,.22);
  --hi:none; --kpi-lead:linear-gradient(135deg,rgba(36,87,245,.10),rgba(36,87,245,0) 65%);
  --av-l:91%; --av-t:32%; --page-glow:rgba(36,87,245,.06); color-scheme:light}}
:root[data-theme="light"]:not([data-xt]),:root[data-xt="light"]{
  --bg:#f3f5f9; --panel:#ffffff; --panel2:#f6f8fb; --panel3:#eef2f7; --line:#e4e9f1; --line2:#d3dbe7;
  --fg:#0c1322; --muted:#566175; --dim:#8a94a6; --input:#ffffff; --hover:rgba(36,87,245,.045);
  --accent:#2457f5; --accent-hi:#1d4ad6; --accent-soft:rgba(36,87,245,.09); --accent-line:rgba(36,87,245,.4);
  --silver:#3b4558;
  --ok:#12945a; --ok-soft:rgba(18,148,90,.1); --warn:#b26a00; --warn-soft:rgba(214,140,20,.13); --bad:#d6342f; --bad-soft:rgba(214,52,47,.09);
  --c-1:#2457f5; --c-2:#8b5cf6; --c-exp:#c4ccd9; --c-target:#dde3ec; --c-axis:#8a94a6; --c-grid:#edf0f5;
  --topbar:rgba(243,245,249,.82); --out-day:#f8fafc; --over:#eef3ff; --card:#ffffff; --card-line:#e1e7f0;
  --shadow:0 1px 2px rgba(16,24,40,.04),0 6px 18px rgba(16,24,40,.05); --shadow-lg:0 30px 80px rgba(16,24,40,.22);
  --hi:none; --kpi-lead:linear-gradient(135deg,rgba(36,87,245,.10),rgba(36,87,245,0) 65%);
  --av-l:91%; --av-t:32%; --page-glow:rgba(36,87,245,.06); color-scheme:light}
:root[data-xt="dark"]{color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;transition:background-color .25s,color .25s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-hi)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.brand{font-family:var(--f-brand);letter-spacing:.04em}
.muted{color:var(--muted)} .dim{color:var(--dim)}
[hidden]{display:none!important}

/* ---------- login ---------- */
#login{min-height:100%;min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);background:var(--bg)}
.lg-stage{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;gap:40px;color:var(--rail-fg);
  padding-block:max(44px,env(safe-area-inset-top,0px)) 40px;padding-left:max(56px,env(safe-area-inset-left,0px));padding-right:56px;
  background:radial-gradient(70% 60% at 50% 46%,rgba(47,107,255,.20),transparent 70%),linear-gradient(160deg,#0a0f1c 0%,#05070b 70%);border-right:1px solid var(--rail-line)}
.lg-stage::before{content:"";position:absolute;inset:-40% -20% 0;background-image:linear-gradient(rgba(109,151,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(109,151,255,.07) 1px,transparent 1px);background-size:56px 56px;
  transform:perspective(700px) rotateX(58deg) translateY(28%);transform-origin:50% 100%;-webkit-mask-image:linear-gradient(to top,#000 10%,transparent 75%);mask-image:linear-gradient(to top,#000 10%,transparent 75%);pointer-events:none}
.lg-stage::after{content:"";position:absolute;width:520px;height:520px;left:50%;top:46%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(47,107,255,.28),transparent 62%);filter:blur(10px);animation:lgPulse 6s ease-in-out infinite;pointer-events:none}
@keyframes lgPulse{0%,100%{opacity:.65;transform:translate(-50%,-50%) scale(.94)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.04)}}
.lg-top,.lg-hero,.lg-bottom{position:relative;z-index:1}
.lg-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.lg-tag{font-family:var(--f-brand);font-size:10.5px;letter-spacing:.28em;color:#c9d1de}
.lg-live{display:inline-flex;align-items:center;gap:8px;font-size:11.5px;color:var(--rail-muted);border:1px solid #263142;border-radius:20px;padding:4px 11px;background:rgba(6,8,12,.5)}
.lg-live i{width:7px;height:7px;border-radius:50%;background:#2fbf71;animation:lgDot 2.4s infinite}
@keyframes lgDot{0%{box-shadow:0 0 0 0 rgba(47,191,113,.55)}70%{box-shadow:0 0 0 8px rgba(47,191,113,0)}100%{box-shadow:0 0 0 0 rgba(47,191,113,0)}}
.lg-hero{display:grid;justify-items:center;gap:30px;text-align:center}
.lg-hero img{width:min(340px,70%);height:auto;filter:drop-shadow(0 18px 40px rgba(47,107,255,.25));animation:lgRise .9s cubic-bezier(.2,.7,.2,1) both}
.lg-hero p{margin:0;max-width:30ch;font-size:17px;line-height:1.5;color:#c9d1de;text-wrap:balance}
.lg-mods{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.lg-mods span{font-size:11.5px;letter-spacing:.06em;color:var(--rail-muted);border:1px solid #263142;background:rgba(14,18,26,.6);border-radius:6px;padding:5px 10px}
.lg-bottom{display:flex;justify-content:space-between;gap:12px;font-size:11.5px;color:var(--rail-dim);font-family:var(--f-mono)}
@keyframes lgRise{from{opacity:.001;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.lg-panel{position:relative;display:grid;place-items:center;padding-block:max(40px,env(safe-area-inset-top,0px)) max(40px,env(safe-area-inset-bottom,0px));padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px));
  background:radial-gradient(60% 40% at 100% 0%,var(--page-glow),transparent 70%),var(--bg)}
.lg-theme{position:absolute;top:max(18px,env(safe-area-inset-top,0px));right:max(18px,env(safe-area-inset-right,0px))}
.lg-form{width:100%;max-width:380px;display:grid;gap:22px;animation:lgRise .7s .1s cubic-bezier(.2,.7,.2,1) both}
.lg-mobile-logo{display:none}
.lg-form h1{margin:0;font-size:28px;font-weight:600;letter-spacing:-.015em}
.lg-form .lede{margin:6px 0 0;color:var(--muted)}
.lg-fields{display:grid;gap:16px}
.lg-in{position:relative;display:flex;align-items:center}
.lg-in>svg{position:absolute;left:13px;width:17px;height:17px;stroke:var(--dim);fill:none;stroke-width:1.7;pointer-events:none;transition:stroke .15s}
.lg-in .inp{padding:12px 44px 12px 40px;border-radius:10px;font-size:14.5px}
.lg-in:focus-within>svg{stroke:var(--accent)}
.lg-eye{position:absolute;right:6px;border:0;background:none;color:var(--dim);padding:7px;border-radius:7px;cursor:pointer;display:grid;place-items:center}
.lg-eye:hover{color:var(--fg);background:var(--panel2)}
.lg-eye svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7}
.lg-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px}
.lg-hint{color:var(--dim);font-size:12.5px}
.lg-caps{color:var(--warn);font-size:12px}
.login-err{color:var(--bad);font-size:13px;background:var(--bad-soft);border:1px solid color-mix(in srgb,var(--bad) 35%,transparent);border-radius:8px;padding:9px 12px}
.login-err:empty{display:none}
.lg-btn{justify-content:center;padding:12px;font-size:14.5px;border-radius:10px}
.lg-btn svg{transition:transform .15s}.lg-btn:hover svg{transform:translateX(3px)}
.lg-foot{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);border-top:1px solid var(--line);padding-top:18px}
.lg-foot svg{width:15px;height:15px;stroke:var(--dim);fill:none;stroke-width:1.7;flex:none}
@media (max-width:960px){
  #login{grid-template-columns:minmax(0,1fr)}
  .lg-stage{display:none}
  .lg-panel{background:radial-gradient(90% 50% at 50% 0%,var(--page-glow),transparent 70%),var(--bg);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));align-items:start}
  .lg-mobile-logo{display:grid;place-items:center;width:150px;height:118px;margin:28px auto 6px;border-radius:22px;background:radial-gradient(circle at 50% 40%,#13213f,#05070b 75%);box-shadow:0 18px 40px rgba(47,107,255,.22)}
  .lg-mobile-logo img{width:108px;height:auto}
  .lg-form h1{font-size:24px;text-align:center}.lg-form .lede{text-align:center}
}

/* ---------- $1B minimalist luxury welcome page ---------- */

/* Parallax Stars Background */
.wel-stars-bg{
  position:absolute;
  inset:0;
  overflow:hidden;
  pointer-events:none;
  z-index:0;
}
.wel-radial-space{
  position:absolute;
  inset:0;
  background:radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
  z-index:0;
}
@keyframes animStar{
  from{transform:translateY(0px)}
  to{transform:translateY(-2000px)}
}
.wel-star-layer{
  position:absolute;
  left:0;
  top:0;
  background:transparent;
  pointer-events:none;
  animation-name:animStar;
  animation-timing-function:linear;
  animation-iteration-count:infinite;
  will-change:transform;
}
.wel-star-layer.small{
  width:1px;
  height:1px;
  animation-duration:50s;
  opacity:0.85;
}
.wel-star-layer.medium{
  width:2px;
  height:2px;
  animation-duration:100s;
  opacity:0.9;
}
.wel-star-layer.big{
  width:3px;
  height:3px;
  animation-duration:150s;
  opacity:0.95;
  border-radius:50%;
}
.wel-star-repeat{
  position:absolute;
  top:2000px;
  width:100%;
  height:100%;
  background:transparent;
  border-radius:inherit;
}
.wel-title.text-gradient-clip{
  background:linear-gradient(180deg, #FFFFFF 0%, #cbd5e1 100%);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

#welcome{
  min-height:100vh;
  min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  align-items:center;
  position:relative;
  background:radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
  color:#f8fafc;
  font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  padding:max(24px,env(safe-area-inset-top,0px)) 32px max(24px,env(safe-area-inset-bottom,0px));
  box-sizing:border-box;
  overflow:hidden;
  animation:welFadeIn .55s cubic-bezier(.16,1,.3,1) both;
}
#welcome::before{
  content:"";
  position:absolute;
  width:720px;
  height:440px;
  left:50%;
  top:42%;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:radial-gradient(circle, rgba(47,107,255,.11) 0%, rgba(147,51,234,.05) 45%, transparent 70%);
  filter:blur(60px);
  pointer-events:none;
}
#welcome.wel-exiting{
  opacity:0;
  transform:scale(1.02);
  filter:blur(10px);
  transition:all .32s cubic-bezier(.2,.8,.2,1);
  pointer-events:none;
}
@keyframes welFadeIn{
  from{opacity:0;transform:scale(.98);filter:blur(6px)}
  to{opacity:1;transform:scale(1);filter:blur(0)}
}
.wel-top{
  width:100%;
  max-width:1180px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:relative;
  z-index:2;
}
.wel-status{
  display:inline-flex;
  align-items:center;
  gap:10px;
  font-size:13px;
  color:#94a3b8;
  letter-spacing:.02em;
}
.wel-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#2fbf71;
  box-shadow:0 0 12px rgba(47,191,113,.8);
}
.wel-top-right{
  display:flex;
  align-items:center;
  gap:16px;
}
.wel-signout{
  display:inline-flex;
  align-items:center;
  gap:7px;
  color:#94a3b8;
  font-size:13.5px;
  background:none;
  border:0;
  cursor:pointer;
  padding:7px 12px;
  border-radius:8px;
  transition:color .15s, background .15s;
}
.wel-signout:hover{
  color:#fff;
  background:rgba(255,255,255,.08);
}
.wel-signout svg{
  width:15px;
  height:15px;
  stroke:currentColor;
  fill:none;
  stroke-width:2;
}
.wel-main{
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  max-width:640px;
  width:100%;
  margin:auto 0;
  padding:36px 24px;
}
.wel-brand-wrap{
  margin-bottom:28px;
}
.wel-brand-logo{
  height:76px;
  width:auto;
  filter:drop-shadow(0 8px 30px rgba(47,107,255,.42));
  transition:transform .3s ease;
}
.wel-brand-logo:hover{
  transform:scale(1.05);
}
.wel-avatar-wrap{
  position:relative;
  margin-bottom:24px;
}
.wel-avatar-frame{
  width:108px;
  height:108px;
  border-radius:50%;
  padding:3px;
  background:linear-gradient(180deg, rgba(255,255,255,.35), rgba(255,255,255,.08));
  box-shadow:0 16px 40px rgba(0,0,0,.6), 0 0 30px rgba(47,107,255,.25);
  display:flex;
  align-items:center;
  justify-content:center;
}
.wel-avatar-frame .avatar{
  width:100%;
  height:100%;
  border-radius:50%;
  font-size:32px;
  font-weight:600;
  background:#111622;
  color:#f8fafc;
  display:grid;
  place-items:center;
  overflow:hidden;
}
.wel-avatar-frame .avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.wel-avatar-dot{
  position:absolute;
  bottom:3px;
  right:3px;
  width:17px;
  height:17px;
  border-radius:50%;
  background:#2fbf71;
  border:3px solid #090A0F;
  box-shadow:0 0 12px rgba(47,191,113,.9);
}
.wel-eyebrow{
  font-size:15px;
  font-weight:500;
  color:#94a3b8;
  letter-spacing:.04em;
  margin-bottom:6px;
}
.wel-title{
  margin:0 0 14px;
  font-size:50px;
  font-weight:700;
  letter-spacing:-.025em;
  color:#ffffff;
  line-height:1.15;
}
.wel-badge{
  display:inline-flex;
  align-items:center;
  gap:10px;
  font-size:14.5px;
  font-weight:500;
  color:#94a3b8;
  background:rgba(255,255,255,.07);
  border:1px solid rgba(255,255,255,.12);
  padding:8px 20px;
  border-radius:999px;
  margin-bottom:38px;
}
.wel-badge b{
  color:#f1f5f9;
  font-weight:600;
}
.wel-cta{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:14px;
  width:100%;
}
.wel-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  background:#ffffff;
  color:#06080d;
  font-family:"Inter",-apple-system,sans-serif;
  font-size:16.5px;
  font-weight:600;
  letter-spacing:-.01em;
  padding:16px 42px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.95);
  cursor:pointer;
  transition:all .22s cubic-bezier(.16,1,.3,1);
  box-shadow:0 0 30px rgba(255,255,255,.2), 0 10px 30px rgba(0,0,0,.4);
}
.wel-btn:hover{
  transform:translateY(-2px);
  background:#ffffff;
  box-shadow:0 0 44px rgba(255,255,255,.38), 0 14px 34px rgba(0,0,0,.5);
}
.wel-btn:active{
  transform:translateY(0);
}
.wel-btn svg{
  width:19px;
  height:19px;
  stroke:currentColor;
  fill:none;
  stroke-width:2.4;
  transition:transform .18s;
}
.wel-btn:hover svg{
  transform:translateX(3px);
}
.wel-hint{
  font-size:13.5px;
  color:#64748b;
}
.wel-hint kbd{
  font-family:var(--f-mono);
  font-size:12px;
  padding:3px 8px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);
  border-radius:6px;
  color:#94a3b8;
}
.wel-foot{
  width:100%;
  max-width:1180px;
  display:flex;
  justify-content:center;
  position:relative;
  z-index:2;
  font-size:13px;
  color:#475569;
}
@media (max-width:640px){
  #welcome{padding:20px}
  .wel-title{font-size:28px}
  .wel-btn{width:100%;padding:14px 24px}
}

/* ---------- shell ---------- */
#app{display:flex;min-height:100%}
#rail{width:248px;flex:none;background:linear-gradient(180deg,var(--rail-2),var(--rail) 30%);border-right:1px solid var(--rail-line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;color:var(--rail-fg);
  padding-top:env(safe-area-inset-top,0px);padding-left:env(safe-area-inset-left,0px);z-index:40}
.rail-head{display:flex;align-items:center;gap:11px;padding:20px 18px 16px}
.rail-head .mk{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#16244a,#070a10 80%);border:1px solid #1d2840;box-shadow:0 6px 18px rgba(47,107,255,.18)}
.rail-head .mk img{width:28px;height:auto}
.rail-head .brand{font-size:10px;line-height:1.5;color:var(--rail-muted);letter-spacing:.16em}
.rail-head .brand b{display:block;color:var(--rail-fg);font-weight:400;font-size:11.5px;letter-spacing:.08em}
#nav{flex:1;overflow-y:auto;padding:4px 12px 16px;display:grid;gap:1px;align-content:start}
.nav-group{font-size:10px;text-transform:uppercase;letter-spacing:.18em;color:var(--rail-dim);padding:16px 10px 6px}
.nav-item{position:relative;display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:9px;border:0;background:none;color:var(--rail-muted);text-align:left;cursor:pointer;width:100%;font-size:13.5px;transition:background .15s,color .15s}
.nav-item svg{width:17px;height:17px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav-item:hover{background:#0f1520;color:var(--rail-fg)}
.nav-item.on{background:var(--rail-on);color:#fff}
.nav-item.on::before{content:"";position:absolute;left:-12px;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:#2f6bff;box-shadow:0 0 12px #2f6bff}
.nav-item.on svg{stroke:#6d97ff}
.rail-welcome-box{margin:0 12px 10px}
.rail-welcome-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:9px;background:linear-gradient(135deg,rgba(47,107,255,.16),rgba(168,123,255,.10));border:1px solid rgba(109,151,255,.32);color:#9abcf8;font-family:var(--f-body);font-size:13px;font-weight:600;letter-spacing:.02em;padding:9px 12px;border-radius:10px;cursor:pointer;transition:all .2s ease;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.rail-welcome-btn:hover{background:linear-gradient(135deg,rgba(47,107,255,.28),rgba(168,123,255,.20));border-color:var(--accent-hi);color:#fff;transform:translateY(-1px);box-shadow:0 6px 18px rgba(47,107,255,.28)}
.rail-welcome-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;flex:none}
.rail-mini .rail-welcome-box{margin:0 8px 10px}
.rail-mini .rail-welcome-btn span{display:none}
.rail-mini .rail-welcome-btn{padding:9px;justify-content:center}
.rail-user{margin:0 12px calc(12px + env(safe-area-inset-bottom,0px));border:1px solid var(--rail-line);background:#0b1018;border-radius:12px;padding:10px;display:flex;align-items:center;gap:8px}
.rail-user .who{min-width:0;flex:1}
.rail-user .who b{display:block;font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail-user .who span{font-size:11px;color:var(--rail-dim)}
.rail-user .btn.ghost{color:var(--rail-muted);padding:5px}
.rail-user .btn.ghost:hover{background:#151c27;color:#fff}
.avatar{--h:220;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:hsl(var(--h) 45% var(--av-l));color:hsl(var(--h) 60% var(--av-t));font-size:11.5px;font-weight:600;flex:none;letter-spacing:.02em}
.avatar.sm{width:24px;height:24px;font-size:9.5px}
.avatar.ph{background:var(--panel3);overflow:hidden;padding:0}
.avatar.ph img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.avatar.lg{width:64px;height:64px;font-size:20px}
.who-cell{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.led-stage.round::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;background:radial-gradient(circle at center,transparent 49.6%,rgba(5,7,11,.55) 50.2%)}
.led-stage.round::after{border-radius:50%}
.led-prev.round .ptile{border-radius:50%;padding:0}
.led-prev.round .ptile img{border-radius:50%;object-fit:cover}
#rail .avatar{background:hsl(var(--h) 45% 24%);color:hsl(var(--h) 60% 82%)}
#main{flex:1;min-width:0;display:flex;flex-direction:column;background:radial-gradient(1200px 500px at 85% -10%,var(--page-glow),transparent 60%)}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--topbar);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;padding-block:11px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.ttl-wrap{flex:1;min-width:0;display:grid;gap:1px}
.ttl-wrap .crumb{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
#ttl{margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#menuBtn{display:none}
.gsearch{position:relative;width:min(340px,32vw)}
.gsearch>svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--dim);fill:none;stroke-width:1.8;pointer-events:none;z-index:1}
.gsearch input{width:100%;background:var(--panel);border:1px solid var(--line2);border-radius:9px;padding:7px 46px 7px 33px;color:var(--fg);font-size:13px;height:36px}
.gsearch input::placeholder{color:var(--dim)}
.gsearch input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.gsearch kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-family:var(--f-mono);font-size:10.5px;color:var(--dim);border:1px solid var(--line2);border-radius:5px;padding:1px 5px;background:var(--panel2)}
.gres{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;display:grid;gap:1px;z-index:35;max-height:420px;overflow-y:auto}
.gres button{display:flex;align-items:center;gap:10px;border:0;background:none;text-align:left;padding:8px 9px;border-radius:8px;cursor:pointer;color:var(--fg);width:100%;min-width:0}
.gres button.sel,.gres button:hover{background:var(--accent-soft)}
.gres .tx{min-width:0;display:grid}
.gres .k{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin-left:auto;flex:none}
.gres .s{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gres .none{padding:14px;color:var(--muted);font-size:13px;text-align:center}
.icon-btn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:9px;border:1px solid var(--line2);background:var(--panel);color:var(--muted);cursor:pointer;flex:none;transition:color .15s,border-color .15s}
.icon-btn:hover{color:var(--fg);border-color:var(--dim)}
.icon-btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#view{padding-block:24px 64px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));display:grid;gap:18px;align-content:start;max-width:1680px;width:100%;margin:0 auto}
#view.enter{animation:viewIn .35s cubic-bezier(.2,.7,.2,1)}
@keyframes viewIn{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}
#scrim{display:none}
@media (max-width:900px){
  #rail{position:fixed;left:0;top:0;bottom:0;z-index:50;transform:translateX(-102%);transition:transform .22s;height:100%}
  #rail.open{transform:none;box-shadow:var(--shadow-lg)}
  #scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:45}
  #menuBtn{display:inline-grid}
  #top,#view{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .gsearch{width:36px;flex:none}
  .gsearch input{padding:0;color:transparent;cursor:pointer}
  .gsearch input::placeholder{color:transparent}
  .gsearch kbd{display:none}
  .gsearch>svg{left:50%;transform:translate(-50%,-50%)}
  .gsearch.open{position:absolute;width:auto;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));top:11px;z-index:36}
  .gsearch.open input{padding:7px 12px 7px 33px;color:var(--fg);cursor:text}
  .gsearch.open>svg{left:11px;transform:translateY(-50%)}
  .ttl-wrap .crumb{display:none}
}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--panel);color:var(--fg);border-radius:9px;padding:7px 12px;cursor:pointer;white-space:nowrap;font-size:13px;font-weight:500;transition:border-color .15s,background .15s,box-shadow .15s,filter .15s}
.btn:hover{border-color:var(--dim)}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.pri{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 86%,#fff),var(--accent));border-color:var(--accent);color:var(--on-accent);box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 28%,transparent),inset 0 1px 0 rgba(255,255,255,.18)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);background:var(--panel2)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,transparent);background:none}
.btn.good{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,transparent);background:none}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:8px}
.btn[disabled]{opacity:.45;pointer-events:none}
.field{display:grid;gap:6px;min-width:0}
.field label{font-size:12px;color:var(--muted);font-weight:500}
.inp{width:100%;background:var(--input);border:1px solid var(--line2);border-radius:9px;padding:8px 11px;color:var(--fg);min-width:0;transition:border-color .15s,box-shadow .15s}
.inp::placeholder{color:var(--dim)}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea.inp{min-height:88px;resize:vertical;line-height:1.5}
select.inp{appearance:auto}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;color:var(--muted);padding:5px 12px;border-radius:7px;cursor:pointer;font-size:12.5px;font-weight:500}
.seg button.on{background:var(--panel);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12),0 0 0 1px var(--line2)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar .inp{width:auto;min-width:0}
.toolbar .grow{flex:1}
.check{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.check input{accent-color:var(--accent);width:15px;height:15px}

/* ---------- surfaces ---------- */
.panel{background:var(--panel);background-image:var(--hi);border:1px solid var(--line);border-radius:var(--r);min-width:0;box-shadow:var(--shadow)}
.panel-h{display:flex;align-items:center;gap:10px;padding:15px 18px 0;flex-wrap:wrap}
.panel-h h3{margin:0;font-size:13.5px;font-weight:600;flex:1;letter-spacing:-.005em}
.panel-h .sub{font-size:12px;color:var(--dim)}
.panel-b{padding:14px 18px 18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-wide{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
.g-cal{grid-template-columns:minmax(0,3fr) minmax(260px,1fr)}
@media (max-width:1100px){.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g-wide,.g-cal{grid-template-columns:minmax(0,1fr)}}
@media (max-width:700px){.g2,.g3{grid-template-columns:minmax(0,1fr)}}
.eyebrow{font-size:10.5px;text-transform:uppercase;letter-spacing:.18em;color:var(--dim)}
.hero{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 20px}
.hero h1{margin:4px 0 0;font-size:26px;font-weight:600;letter-spacing:-.02em;text-wrap:balance}
.hero .grow{flex:1;min-width:200px}

/* KPI cards */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:12px}
.kpi{background:var(--panel);background-image:var(--hi);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 13px;display:grid;gap:5px;min-width:0;position:relative;box-shadow:var(--shadow);overflow:hidden;align-content:start}
.kpi .lbl{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;font-weight:500;padding-right:70px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .val{font-family:var(--f-body);font-weight:600;font-size:23px;letter-spacing:-.025em;font-variant-numeric:tabular-nums lining-nums;white-space:nowrap;overflow:hidden;line-height:1.25;color:var(--fg)}
.kpi .val .cu{font-size:.52em;font-weight:500;letter-spacing:.06em;color:var(--muted);margin-right:5px}
.kpi .val .num{font-family:inherit}
.kpi .foot{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.kpi.lead{background:var(--kpi-lead),var(--panel);border-color:var(--accent-line)}
.kpi.lead .val{font-size:27px}
.kpi svg.spark{position:absolute;right:12px;top:13px;width:68px;height:24px}
.panel .kpis .kpi{box-shadow:none;background:var(--panel2)}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.kpi{padding:12px}.kpi.lead{grid-column:1/-1}.kpi .val{font-size:19px}.kpi.lead .val{font-size:24px}.kpi .lbl{padding-right:0}.kpi:not(.lead) svg.spark{display:none}.hero h1{font-size:22px}}
.delta{font-family:var(--f-mono);font-size:11.5px;font-weight:500;border-radius:5px;padding:0 5px;background:var(--panel3);color:var(--muted)}
.delta.up{color:var(--ok);background:var(--ok-soft)} .delta.down{color:var(--bad);background:var(--bad-soft)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:2px 9px;font-size:11.5px;font-weight:500;background:var(--panel3);color:var(--muted);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.blue{background:var(--accent-soft);color:var(--accent-hi)}
.pill.plain::before{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;padding:1px 8px 1px 7px;border-radius:6px;background:var(--panel2);color:var(--silver);border:1px solid var(--line2);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:middle;font-weight:500}
.chip .d{width:7px;height:7px;border-radius:2px;flex:none}

/* tables */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:500;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.07em;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:default}
.tbl th.sort{cursor:pointer} .tbl th.sort:hover{color:var(--fg)}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--hover)}
.tbl td.r,.tbl th.r{text-align:right}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl .strong{font-weight:500;color:var(--fg)}
.tbl input.inp{padding:5px 8px;max-width:150px;text-align:right}
.empty{padding:30px 16px;text-align:center;color:var(--muted);display:grid;gap:8px;justify-items:center}
.empty::before{content:"";width:38px;height:38px;border-radius:12px;background:var(--accent-soft);border:1px dashed var(--accent-line);margin-bottom:4px}
.empty b{color:var(--fg);font-weight:600}

/* bars */
.hbars{display:grid;gap:12px}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 12px;align-items:center;font-size:13px}
.hbar .track{grid-column:1/-1;height:7px;background:var(--panel3);border-radius:4px;overflow:hidden}
.hbar .fill{height:100%;background:var(--accent);border-radius:4px}
.hbar[data-act]:hover>span:first-child{color:var(--accent-hi)}
.prog{height:6px;background:var(--panel3);border-radius:4px;overflow:hidden;min-width:60px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:4px}

/* charts */
.chart{width:100%;display:block}
.chart text{fill:var(--c-axis);font-family:var(--f-mono);font-size:10.5px}
.chart .grid-l{stroke:var(--c-grid);stroke-width:1}
.chart .hit{fill:transparent}
.chart .hit:hover{fill:var(--hover)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
#tip{position:fixed;z-index:90;pointer-events:none;background:var(--tip-bg);color:var(--tip-fg);border:1px solid var(--tip-line);border-radius:8px;padding:7px 10px;font-size:12px;max-width:240px;display:none;box-shadow:0 10px 30px rgba(0,0,0,.35);line-height:1.5}

/* pipeline board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);gap:12px;overflow-x:auto;padding-bottom:10px;align-items:start}
.col{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;max-height:calc(100vh - 250px);min-height:200px;transition:border-color .15s,background .15s}
.col.over{border-color:var(--accent);background:var(--over)}
.col-h{padding:12px;display:grid;gap:3px;border-bottom:1px solid var(--line)}
.col-h b{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:8px}
.col-h b i{width:8px;height:8px;border-radius:3px;display:inline-block}
.col-h span{font-size:11.5px;color:var(--dim);font-family:var(--f-mono)}
.col-b{padding:8px;display:grid;gap:8px;overflow-y:auto;align-content:start;flex:1}
.card{background:var(--card);border:1px solid var(--card-line);border-radius:10px;padding:11px;display:grid;gap:7px;cursor:grab;text-align:left;width:100%;color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08);transition:border-color .15s,transform .15s,box-shadow .15s}
.card:hover{border-color:var(--accent-line);transform:translateY(-1px);box-shadow:var(--shadow)}
.card .t{font-weight:600;font-size:13px;display:flex;gap:8px;align-items:start;justify-content:space-between}
.card .m{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
.card .v{font-family:var(--f-mono);font-size:12px;color:var(--fg);white-space:nowrap;font-weight:500}
.due{font-size:11px;font-family:var(--f-mono);color:var(--muted)}
.due.late{color:var(--bad)} .due.today{color:var(--warn)}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal .dow{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;padding:10px 8px;border-bottom:1px solid var(--line);font-weight:500}
.cal .day{min-height:108px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0;transition:background .12s}
.cal .day:nth-child(7n){border-right:0}
.cal .day:hover{background:var(--hover)}
.cal .day.out{background:var(--out-day)}
.cal .day.out .dn{color:var(--dim)}
.cal .dn{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);align-self:flex-start;padding:1px 5px;border-radius:5px}
.cal .day.today .dn{color:#fff;background:var(--accent)}
.ev{--c:var(--accent);font-size:11px;padding:2px 6px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:0;border-left:2px solid var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--fg);cursor:pointer;text-align:left;width:100%}
.ev.t-Follow-up{--c:var(--warn)} .ev.t-Demo{--c:var(--c-2)} .ev.t-Call{--c:var(--ok)} .ev.t-Deadline,.ev.t-Launch{--c:var(--bad)} .ev.t-Task{--c:var(--dim)}
.ev.done{opacity:.45;text-decoration:line-through}
.more{font-size:11px;color:var(--dim)}

/* ---------- sidebar v2: navy rail, active item is a tab cut into the page ---------- */
:root{--rail:#131b33;--rail-2:#18223f;--rail-line:rgba(255,255,255,.07);--rail-fg:#f2f5fb;--rail-muted:#c3cbdc;--rail-dim:#7d89a6;--rail-ic:#6d97ff;--rail-w:262px}
#rail{width:var(--rail-w);background:linear-gradient(180deg,var(--rail-2),var(--rail) 40%);border-right:0;transition:width .22s cubic-bezier(.2,.7,.2,1)}
.rail-head{padding:22px 16px 18px 22px;border-bottom:1px solid var(--rail-line);margin-bottom:22px;gap:10px}
.rail-head .brand{flex:1;min-width:0;white-space:nowrap;overflow:hidden}
.rail-min{flex:none;width:30px;height:30px;border-radius:8px;border:0;background:none;color:var(--rail-ic);display:grid;place-items:center;cursor:pointer;transition:background .15s,transform .22s}
.rail-min:hover{background:rgba(255,255,255,.06)}
.rail-min svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#nav{padding:6px 0 18px 14px;gap:3px;overflow-x:hidden}
/* menu scrollbar sits on the left edge, away from the active tab */
#nav{direction:rtl;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.16) transparent}
#nav>*{direction:ltr}
#nav::-webkit-scrollbar{width:6px}#nav::-webkit-scrollbar-track{background:transparent}
#nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:6px}#nav::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.28)}
.nav-group{padding:16px 12px 6px;color:var(--rail-dim);font-size:9.5px;letter-spacing:.2em}
.nav-item{margin-right:14px;padding:12px 14px;border-radius:12px;gap:14px;color:var(--rail-fg);font-weight:600;font-size:14px;letter-spacing:.005em}
.nav-item>svg:first-child{width:20px;height:20px;stroke:var(--rail-ic);stroke-width:1.8}
.nav-item .nl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-item .chev{width:14px;height:14px;flex:none;stroke:var(--rail-ic);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;opacity:.75;transition:transform .15s,opacity .15s}
.nav-item:hover{background:rgba(255,255,255,.05);color:#fff}
.nav-item:hover .chev{transform:translateX(2px);opacity:1}
.nav-item.on{margin-right:0;border-radius:30px 0 0 30px;background:var(--bg);color:var(--accent-hi);padding-left:16px;z-index:1}
:root[data-xt="dark"] .nav-item.on,.nav-item.on{color:var(--accent-hi)}
.nav-item.on>svg:first-child{stroke:var(--accent-hi)}
.nav-item.on .chev{display:none}
.nav-item.on::before,.nav-item.on::after{content:"";position:absolute;right:0;width:24px;height:24px;pointer-events:none;box-shadow:none;border-radius:0;left:auto;top:auto;bottom:auto}
.nav-item.on::before{top:-24px;background:radial-gradient(circle at 0 0,transparent 23.5px,var(--bg) 24px)}
.nav-item.on::after{bottom:-24px;background:radial-gradient(circle at 0 100%,transparent 23.5px,var(--bg) 24px)}
.nav-item .cnt{margin-left:0}
.rail-user{background:rgba(255,255,255,.04);border-color:var(--rail-line)}
/* collapsed (desktop) */
@media (min-width:901px){
  #app.rail-mini{--rail-w:88px}
  #app.rail-mini .rail-head{flex-direction:column;padding:18px 0 14px;gap:12px}
  #app.rail-mini .rail-head .brand,#app.rail-mini .nav-group,#app.rail-mini .nav-item .nl,#app.rail-mini .nav-item .chev,#app.rail-mini .rail-user .who,#app.rail-mini .rail-user .btn{display:none}
  #app.rail-mini .rail-min{transform:rotate(180deg)}
  #app.rail-mini #nav{padding-left:12px}
  #app.rail-mini .nav-item{justify-content:center;padding:12px 0;margin-right:12px}
  #app.rail-mini .nav-item.on{margin-right:0;padding-left:0;padding-right:12px}
  #app.rail-mini .nav-item .cnt{position:absolute;top:4px;right:8px;padding:0 5px;font-size:9.5px}
  #app.rail-mini .nav-item.on .cnt{right:20px}
  #app.rail-mini .rail-user{justify-content:center;margin:0 10px calc(12px + env(safe-area-inset-bottom,0px));padding:8px}
  #app.rail-mini .nav-group+.nav-item{margin-top:10px}
}
@media (max-width:900px){.rail-min{display:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.ov2-stat-sub{font-size:12px;color:var(--muted);margin-top:6px;display:flex;align-items:center;gap:6px}
.ov2-trend-up{color:#10b981;font-weight:600;display:inline-flex;align-items:center;gap:3px}
.ov2-trend-down{color:#ef4444;font-weight:600;display:inline-flex;align-items:center;gap:3px}
.ov2-legend{display:flex;align-items:center;gap:14px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.ov2-legend-item{display:flex;align-items:center;gap:6px}
.ov2-legend-dot{width:6px;height:6px;border-radius:50%}
.ov2-chart-wrap{display:flex;align-items:stretch;gap:12px;height:240px;margin-top:8px;position:relative}
.ov2-y-axis{display:flex;flex-direction:column;justify-content:space-between;font-size:11px;color:var(--dim);font-family:var(--f-mono);padding-bottom:26px;text-align:right;min-width:32px;user-select:none}
.ov2-bars-row{display:flex;flex:1;align-items:stretch;justify-content:space-between;gap:10px;position:relative}
.ov2-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;position:relative;cursor:pointer;transition:transform .15s}
.ov2-col:hover{transform:translateY(-2px)}
.ov2-col-badge{margin-bottom:8px;font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;font-variant-numeric:tabular-nums;line-height:1.2}
.ov2-col-badge.up{background:rgba(16,185,129,.16);color:#10b981}
.ov2-col-badge.down{background:rgba(239,68,68,.16);color:#ef4444}
.ov2-capsule-track{width:100%;max-width:54px;height:160px;border-radius:999px;position:relative;overflow:hidden;
  background:repeating-linear-gradient(45deg,rgba(160,180,205,.12) 0,rgba(160,180,205,.12) 3px,transparent 3px,transparent 8px),rgba(240,244,250,.45);
  border:1px solid rgba(200,215,235,.35);transition:all .2s ease;display:flex;flex-direction:column;justify-content:flex-end}
:root[data-xt="dark"] .ov2-capsule-track,:root[data-theme="dark"] .ov2-capsule-track{
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.04) 0,rgba(255,255,255,.04) 3px,transparent 3px,transparent 8px),rgba(255,255,255,.02);
  border-color:rgba(255,255,255,.08)
}
.ov2-col.active .ov2-capsule-track{
  background:radial-gradient(circle at 40% 25%,#2a3345 0%,#0d121c 100%),repeating-linear-gradient(45deg,rgba(255,255,255,.08) 0,rgba(255,255,255,.08) 2px,transparent 2px,transparent 6px);
  border:2px solid rgba(16,185,129,.7);
  box-shadow:0 0 0 3px rgba(16,185,129,.25),0 12px 28px rgba(0,0,0,.35)
}
.ov2-capsule-fill{width:100%;border-radius:999px;background:rgba(47,107,255,.15);transition:height .4s cubic-bezier(.2,.7,.2,1)}
.ov2-card.ov2-profit-card{overflow:visible!important}
.ov2-tooltip{position:absolute;bottom:calc(100% + 12px);left:50%;transform:translateX(-50%) translateY(6px);background:#0d121c;color:#fff;padding:10px 14px;border-radius:14px;
  border:1px solid rgba(255,255,255,.14);box-shadow:0 16px 36px rgba(0,0,0,.55);min-width:145px;z-index:30;pointer-events:none;
  opacity:0;visibility:hidden;transition:opacity .18s ease,transform .18s ease,visibility .18s;white-space:nowrap}
.ov2-tooltip::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);border-width:6px;border-style:solid;border-color:#0d121c transparent transparent transparent}
.ov2-col:hover .ov2-tooltip{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
.ov2-col:first-child .ov2-tooltip{left:0;transform:translateX(0) translateY(6px)}
.ov2-col:first-child:hover .ov2-tooltip{transform:translateX(0) translateY(0)}
.ov2-col:first-child .ov2-tooltip::after{left:26px;transform:none}
.ov2-col:last-child .ov2-tooltip{left:auto;right:0;transform:translateX(0) translateY(6px)}
.ov2-col:last-child:hover .ov2-tooltip{transform:translateX(0) translateY(0)}
.ov2-col:last-child .ov2-tooltip::after{left:auto;right:26px;transform:none}
.ov2-tt-month{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#8a95a8;margin-bottom:6px;border-bottom:1px solid rgba(255,255,255,.08);padding-bottom:4px}
.ov2-tt-row{display:flex;align-items:center;gap:6px;font-size:11.5px;margin-top:3px}
.ov2-tt-dot{width:6px;height:6px;border-radius:50%;flex:none}
.ov2-tt-val{font-weight:600;font-variant-numeric:tabular-nums;color:#fff}
.ov2-tt-lbl{color:#8a95a8;font-size:10.5px;margin-left:auto}
.ov2-col-month{margin-top:8px;font-size:11.5px;color:var(--dim);font-weight:500}
.ov2-col.active .ov2-col-month{color:var(--fg);font-weight:700}

/* Sales Performance & Modern Minimalist Gauge */
.ov2-gauge-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;padding:4px 0 2px}
.ov2-gauge-svg{width:100%;max-width:248px;height:auto;overflow:visible}
.ov2-perf-stats{display:flex;align-items:stretch;gap:14px;margin-top:12px;padding:12px 16px;border-radius:16px;background:var(--panel2);border:1px solid var(--line);transition:border-color .15s}
:root:not([data-xt="dark"]):not([data-theme="dark"]) .ov2-perf-stats{background:#f8fafc;border-color:#e8edf5}
:root[data-xt="dark"] .ov2-perf-stats,:root[data-theme="dark"] .ov2-perf-stats{background:rgba(255,255,255,.025);border-color:rgba(255,255,255,.07)}
.ov2-perf-col{flex:1;min-width:0;display:flex;flex-direction:column}
.ov2-perf-divider{width:1px;background:var(--line);align-self:stretch;flex:none;opacity:.8}
:root:not([data-xt="dark"]):not([data-theme="dark"]) .ov2-perf-divider{background:#e2e8f0}
.ov2-perf-stat-lbl{font-size:11.5px;color:var(--muted);font-weight:500;display:flex;align-items:center;justify-content:space-between;gap:6px}
.ov2-perf-stat-val{font-size:21px;font-weight:700;color:var(--fg);margin-top:3px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.2}
.ov2-perf-stat-sub{font-size:10.5px;color:var(--dim);margin-top:3px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov2-pct-pill{display:inline-flex;align-items:center;padding:1.5px 7px;border-radius:999px;background:rgba(16,185,129,.12);color:#10b981;font-weight:600;font-size:10.5px;font-variant-numeric:tabular-nums;line-height:1.3}
.ov2-pct-pill.down{background:rgba(239,68,68,.12);color:#ef4444}
.ov2-pct-pill.neutral{background:var(--panel3);color:var(--muted);border:1px solid var(--line)}
.ov2-alert-banner{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding:9px 13px;border-radius:12px;font-size:12px;font-weight:500;transition:all .15s ease}
:root:not([data-xt="dark"]):not([data-theme="dark"]) .ov2-alert-banner{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534}
:root[data-xt="dark"] .ov2-alert-banner,:root[data-theme="dark"] .ov2-alert-banner{background:rgba(16,185,129,.09);border:1px solid rgba(16,185,129,.24);color:#ecfdf5}
.ov2-alert-left{display:flex;align-items:center;gap:8px;min-width:0}
.ov2-alert-icon{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex:none}
:root:not([data-xt="dark"]):not([data-theme="dark"]) .ov2-alert-icon{background:#dcfce7;color:#15803d}
:root[data-xt="dark"] .ov2-alert-icon{background:rgba(16,185,129,.18);color:#10b981}
.ov2-alert-text{font-size:11.5px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov2-alert-text strong{font-weight:600}
.ov2-alert-close{background:none;border:none;color:currentColor;opacity:.65;cursor:pointer;padding:2px 5px;border-radius:6px;font-size:13px;line-height:1;transition:opacity .15s,background .15s}
.ov2-alert-close:hover{opacity:1;background:rgba(0,0,0,.06)}
:root[data-xt="dark"] .ov2-alert-close:hover{background:rgba(255,255,255,.1)}

/* Recent Transactions Table */
.ov2-table-wrap{overflow-x:auto;margin-top:6px}
.ov2-table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
.ov2-table th{font-size:11px;text-transform:none;color:var(--dim);font-weight:500;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
.ov2-table td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
.ov2-table tbody tr{cursor:pointer;transition:background .12s}
.ov2-table tbody tr:hover{background:var(--hover)}
.ov2-table tbody tr:last-child td{border-bottom:none}
.ov2-chk{width:16px;height:16px;border-radius:4px;accent-color:#10b981;cursor:pointer}
.ov2-prod-cell{display:flex;align-items:center;gap:12px}
.ov2-prod-thumb{width:36px;height:36px;border-radius:8px;background:var(--panel2);border:1px solid var(--line2);display:grid;place-items:center;flex:none;font-size:16px}
.ov2-prod-name{font-weight:600;color:var(--fg);font-size:13px}
.ov2-prod-sub{font-size:11px;color:var(--muted)}
.ov2-cust-cell{display:flex;align-items:center;gap:9px}
.ov2-badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:600}
.ov2-badge.completed{background:rgba(16,185,129,.12);color:#10b981}
.ov2-badge.cancelled{background:rgba(239,68,68,.12);color:#ef4444}
.ov2-badge.pending{background:rgba(56,189,248,.12);color:#0284c7}

/* Top Market & Top Product */
.ov2-market-list{display:flex;flex-direction:column;gap:14px;margin-top:8px}
.ov2-market-row{display:flex;align-items:center;justify-content:space-between;padding:4px 0}
.ov2-mkt-left{display:flex;align-items:center;gap:12px}
.ov2-mkt-flag{width:34px;height:34px;border-radius:50%;background:var(--panel2);border:1px solid var(--line2);display:grid;place-items:center;font-size:16px;flex:none}
.ov2-mkt-name{font-weight:600;font-size:13px;color:var(--fg)}
.ov2-mkt-right{display:flex;align-items:center;gap:12px;font-variant-numeric:tabular-nums}
.ov2-mkt-amt{font-weight:600;font-size:13px;color:var(--fg)}
.ov2-pct-pill{padding:3px 9px;border-radius:999px;background:rgba(16,185,129,.15);color:#10b981;font-weight:700;font-size:11.5px}

.ov2-prods-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px}
.ov2-prod-card{border-radius:20px;padding:16px 12px;text-align:center;cursor:pointer;transition:transform .15s,box-shadow .15s;position:relative;overflow:hidden}
.ov2-prod-card:hover{transform:translateY(-2px)}
.ov2-prod-card.dark{
  background:#0d121c;
  background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.05) 0,rgba(255,255,255,.05) 2px,transparent 2px,transparent 6px),radial-gradient(circle at 40% 20%,#242d3e 0%,#090c12 100%);
  border:1px solid rgba(255,255,255,.12);color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.3)
}
.ov2-prod-card.light{
  background:var(--panel2);border:1px solid var(--line);color:var(--fg)
}
.ov2-prod-icon-box{width:46px;height:46px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;background:#fff;color:#0d121c;box-shadow:0 4px 12px rgba(0,0,0,.15);font-size:20px}
.ov2-prod-cname{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov2-prod-cstat{font-size:11.5px;color:var(--muted);margin-top:4px;display:flex;align-items:center;justify-content:center;gap:6px}
.ov2-prod-card.dark .ov2-prod-cstat{color:#8a95a8}

/* ================= APPLE IPHONE NATIVE MOBILE APP UX SYSTEM ================= */
@media (max-width: 960px) {
  /* 0. Full Viewport App Shell - Ensures #main has 100% width and #rail is off-canvas */
  #app {
    display: block !important;
    width: 100% !important;
    max-width: 100vw !important;
    overflow-x: hidden !important;
    position: relative !important;
    min-height: 100vh !important;
  }
  #main {
    width: 100% !important;
    min-width: 100% !important;
    max-width: 100% !important;
    flex: none !important;
    display: block !important;
  }
  #rail {
    position: fixed !important;
    left: 0 !important;
    top: 0 !important;
    bottom: 0 !important;
    width: min(310px, 84vw) !important;
    border-radius: 0 28px 28px 0 !important;
    box-shadow: 0 0 60px rgba(0, 0, 0, 0.6) !important;
    transform: translateX(-105%) !important;
    transition: transform 0.28s cubic-bezier(0.2, 0.9, 0.4, 1) !important;
    z-index: 100 !important;
  }
  #rail.open {
    transform: translateX(0) !important;
  }
  #scrim {
    z-index: 95 !important;
    backdrop-filter: blur(10px) !important;
    -webkit-backdrop-filter: blur(10px) !important;
  }

  /* 1. Global iOS Touch & Physics */
  *, *::before, *::after {
    -webkit-tap-highlight-color: transparent !important;
  }
  html, body {
    overscroll-behavior-y: none;
    -webkit-user-select: none;
    user-select: none;
  }
  input, textarea, [contenteditable="true"] {
    -webkit-user-select: text;
    user-select: text;
  }

  /* Smooth haptic-like touch press feedback */
  button, .btn, .icon-btn, .nav-item, .ag-item, .ios-tab-item, .ov2-round-btn, .ov2-pill-btn, .ov2-dark-btn {
    touch-action: manipulation;
  }
  button:active, .btn:active, .icon-btn:active, .ios-tab-item:active, .ov2-prod-card:active, .ag-item:active {
    transform: scale(0.96) !important;
    transition: transform 0.1s cubic-bezier(0.2, 0.9, 0.4, 1) !important;
  }

  /* 2. Safe Areas & View Padding */
  #view {
    padding-left: max(14px, env(safe-area-inset-left, 0px)) !important;
    padding-right: max(14px, env(safe-area-inset-right, 0px)) !important;
    padding-top: 14px !important;
    padding-bottom: calc(88px + env(safe-area-inset-bottom, 16px)) !important;
    gap: 14px !important;
  }

  /* 3. Apple Frosted Glass Top Navigation Bar - Ultra Pro iOS UI/UX */
  #top {
    position: sticky !important;
    top: 0 !important;
    z-index: 40 !important;
    height: 56px !important;
    padding-top: max(8px, env(safe-area-inset-top, 0px)) !important;
    padding-bottom: 8px !important;
    padding-left: max(14px, env(safe-area-inset-left, 0px)) !important;
    padding-right: max(14px, env(safe-area-inset-right, 0px)) !important;
    backdrop-filter: blur(30px) saturate(200%) !important;
    -webkit-backdrop-filter: blur(30px) saturate(200%) !important;
    display: flex !important;
    align-items: center !important;
    gap: 8px !important;
    border-bottom: 0.5px solid !important;
    box-sizing: content-box !important;
    transition: background 0.2s ease, border-color 0.2s ease !important;
  }
  :root:not([data-xt="dark"]):not([data-theme="dark"]) #top {
    background: rgba(255, 255, 255, 0.82) !important;
    border-bottom-color: rgba(60, 60, 67, 0.14) !important;
    box-shadow: 0 1px 0 rgba(0, 0, 0, 0.03), 0 4px 16px rgba(0, 0, 0, 0.02) !important;
  }
  :root[data-xt="dark"] #top, :root[data-theme="dark"] #top {
    background: rgba(18, 22, 32, 0.82) !important;
    border-bottom-color: rgba(255, 255, 255, 0.1) !important;
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.04), 0 4px 20px rgba(0, 0, 0, 0.4) !important;
  }

  /* iOS Ultra Pro Header Buttons & Squircles */
  #top .icon-btn {
    width: 38px !important;
    height: 38px !important;
    border-radius: 12px !important;
    display: inline-grid !important;
    place-items: center !important;
    border: 0.5px solid transparent !important;
    cursor: pointer !important;
    flex: none !important;
    transition: transform 0.14s cubic-bezier(0.2, 0.8, 0.2, 1), background 0.15s ease, border-color 0.15s ease !important;
    -webkit-tap-highlight-color: transparent !important;
  }
  :root:not([data-xt="dark"]):not([data-theme="dark"]) #top .icon-btn {
    background: rgba(118, 118, 128, 0.12) !important;
    color: #1c1c1e !important;
    border-color: rgba(0, 0, 0, 0.04) !important;
  }
  :root[data-xt="dark"] #top .icon-btn, :root[data-theme="dark"] #top .icon-btn {
    background: rgba(255, 255, 255, 0.09) !important;
    color: #f2f2f7 !important;
    border-color: rgba(255, 255, 255, 0.06) !important;
  }
  #top .icon-btn:active {
    transform: scale(0.92) !important;
    opacity: 0.85 !important;
  }
  #top .icon-btn svg {
    width: 19px !important;
    height: 19px !important;
    stroke-width: 2 !important;
  }

  /* iOS Search Icon Button & Full Overlay */
  .gsearch {
    width: 38px !important;
    height: 38px !important;
    flex: none !important;
    position: relative !important;
  }
  .gsearch input {
    width: 38px !important;
    height: 38px !important;
    padding: 0 !important;
    color: transparent !important;
    cursor: pointer !important;
    border-radius: 12px !important;
    border: 0.5px solid transparent !important;
    transition: transform 0.14s cubic-bezier(0.2, 0.8, 0.2, 1), background 0.15s ease !important;
  }
  :root:not([data-xt="dark"]):not([data-theme="dark"]) .gsearch input {
    background: rgba(118, 118, 128, 0.12) !important;
    border-color: rgba(0, 0, 0, 0.04) !important;
  }
  :root[data-xt="dark"] .gsearch input, :root[data-theme="dark"] .gsearch input {
    background: rgba(255, 255, 255, 0.09) !important;
    border-color: rgba(255, 255, 255, 0.06) !important;
  }
  .gsearch:active input {
    transform: scale(0.92) !important;
  }
  .gsearch input::placeholder {
    color: transparent !important;
  }
  .gsearch kbd {
    display: none !important;
  }
  .gsearch > svg {
    left: 50% !important;
    top: 50% !important;
    transform: translate(-50%, -50%) !important;
    width: 18px !important;
    height: 18px !important;
    stroke-width: 2 !important;
    color: var(--fg) !important;
    opacity: 0.85 !important;
    pointer-events: none !important;
  }
  .gsearch.open {
    position: absolute !important;
    width: auto !important;
    left: max(10px, env(safe-area-inset-left, 0px)) !important;
    right: max(10px, env(safe-area-inset-right, 0px)) !important;
    top: 8px !important;
    height: 40px !important;
    z-index: 50 !important;
    animation: iosSearchSlideIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) !important;
  }
  @keyframes iosSearchSlideIn {
    from { opacity: 0; transform: translateY(-4px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .gsearch.open input {
    width: 100% !important;
    height: 40px !important;
    padding: 0 14px 0 38px !important;
    color: var(--fg) !important;
    cursor: text !important;
    border-radius: 12px !important;
    font-size: 14px !important;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2) !important;
  }
  :root:not([data-xt="dark"]):not([data-theme="dark"]) .gsearch.open input {
    background: #ffffff !important;
    border: 1px solid rgba(0, 113, 227, 0.5) !important;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12) !important;
  }
  :root[data-xt="dark"] .gsearch.open input, :root[data-theme="dark"] .gsearch.open input {
    background: #1c2230 !important;
    border: 1px solid rgba(10, 132, 255, 0.5) !important;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.5) !important;
  }
  .gsearch.open > svg {
    left: 12px !important;
    top: 50% !important;
    transform: translateY(-50%) !important;
  }

  /* iOS Language Pill Button */
  #top .lang-btn {
    height: 38px !important;
    padding: 0 12px !important;
    border-radius: 12px !important;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Alexandria", var(--f-body) !important;
    font-size: 13px !important;
    font-weight: 600 !important;
    letter-spacing: -0.01em !important;
    border: 0.5px solid transparent !important;
    gap: 5px !important;
    transition: transform 0.14s cubic-bezier(0.2, 0.8, 0.2, 1), background 0.15s ease !important;
    -webkit-tap-highlight-color: transparent !important;
  }
  :root:not([data-xt="dark"]):not([data-theme="dark"]) #top .lang-btn {
    background: rgba(118, 118, 128, 0.12) !important;
    color: #1c1c1e !important;
    border-color: rgba(0, 0, 0, 0.04) !important;
  }
  :root[data-xt="dark"] #top .lang-btn, :root[data-theme="dark"] #top .lang-btn {
    background: rgba(255, 255, 255, 0.09) !important;
    color: #f2f2f7 !important;
    border-color: rgba(255, 255, 255, 0.06) !important;
  }
  #top .lang-btn:active {
    transform: scale(0.92) !important;
    opacity: 0.85 !important;
  }
  #top .lang-btn svg {
    width: 16px !important;
    height: 16px !important;
    stroke-width: 2 !important;
  }

  /* iOS Action Button (+ New) */
  #newWrap .btn.pri {
    height: 38px !important;
    padding: 0 14px !important;
    border-radius: 12px !important;
    font-size: 13px !important;
    font-weight: 600 !important;
